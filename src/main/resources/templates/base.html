<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="fr"
      th:fragment="layout(title, main)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Le <title> vient de la page appelante (chat.html) -->
    <title th:replace="${title}">Talking Hawa</title>

    <!-- Lien vers Bootstrap local -->
    <link rel="stylesheet" th:href="@{/vendor/CSS/bootstrap.min.css}">
</head>
<body>

<!-- Inclusion du Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Contenu dynamique de la page : le <main> de chat.html -->
<div class="container my-4">
    <main th:replace="${main}">Contenu de la page</main>
</div>

<!-- Inclusion du Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Script JS de Bootstrap local -->
<script th:src="@{/vendor/JS/bootstrap.bundle.min.js}"></script>
</body>
</html>
