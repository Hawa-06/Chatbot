<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, activePage, content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} ?: 'Talking Hawa'">Talking Hawa</title>
    <style>
        :root {
            --bg-gradient-start: #fdf2f7;
            --bg-gradient-end: #fff8fb;
            --card-bg: #ffffff;
            --pink-primary: #e83e8c;
            --pink-hover: #d42d7a;
            --pink-soft: #fce7f3;
            --navy-btn: #1e3a70;
            --navy-hover: #152b54;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-input: #e5e7eb;
            --input-bg: #f9fafb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, var(--bg-gradient-start), var(--bg-gradient-end) 65%);
            color: var(--text-main);
        }

        /* Header */
        .app-header {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--pink-soft);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
        }

        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #fde68a;
            border: 2px solid var(--pink-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            overflow: hidden;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-title span {
            color: var(--pink-primary);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover {
            background-color: var(--bg-gradient-start);
            color: var(--text-main);
        }

        .nav-link.active {
            background-color: var(--pink-soft);
            color: var(--pink-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-upgrade {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--navy-btn);
            color: #ffffff;
            text-decoration: none;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 0.86rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .btn-upgrade:hover {
            background-color: var(--navy-hover);
            transform: translateY(-1px);
        }

        .btn-logout {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.86rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-input);
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .btn-logout:hover {
            border-color: var(--pink-primary);
            color: var(--pink-primary);
        }

        /* Zone centrale */
        .app-main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Footer */
        .app-footer {
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--pink-soft);
            margin-top: auto;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .footer-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .footer-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .footer-title span {
            color: var(--pink-primary);
        }

        .footer-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--pink-primary);
            background-color: var(--pink-soft);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
        }

        .footer-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.86rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--pink-primary);
        }

        .footer-copy {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .header-nav {
                display: none;
            }

            .footer-container {
                flex-direction: column;
                text-align: center;
                justify-content: center;
            }

            .footer-links {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-container">
        <a th:href="@{/}" class="header-brand">
            <span class="header-avatar" aria-hidden="true">👩🏾‍🦱</span>
            <span class="header-title">Talking <span>Hawa</span></span>
        </a>

        <nav class="header-nav" aria-label="Navigation principale">
            <a th:href="@{/chat}"
               th:classappend="${activePage == 'chat'} ? ' active'"
               class="nav-link">💬 Chatbot</a>
            <a th:href="@{/historique}"
               th:classappend="${activePage == 'historique'} ? ' active'"
               class="nav-link">Historique</a>
            <a th:href="@{/parametres}"
               th:classappend="${activePage == 'parametres'} ? ' active'"
               class="nav-link">Paramètres</a>
        </nav>

        <div class="header-actions">
            <a th:href="@{/upgrade}" class="btn-upgrade">✦ Mettre à niveau</a>
            <a th:href="@{/login}" class="btn-logout">Déconnexion</a>
        </div>
    </div>
</header>

<main class="app-main">
    <div th:replace="${content}"></div>
</main>

<footer class="app-footer">
    <div class="footer-container">
        <div class="footer-brand">
            <span class="footer-title">Talking <span>Hawa</span></span>
            <span class="footer-badge">Assistant IA Personnel</span>
        </div>

        <nav class="footer-links" aria-label="Liens de pied de page">
            <a th:href="@{/mentions-legales}">Mentions légales</a>
            <a th:href="@{/confidentialite}">Confidentialité</a>
            <a th:href="@{/conditions}">CGU</a>
            <a th:href="@{/contact}">Contact</a>
        </nav>

        <p class="footer-copy">
            © <span th:text="${#dates.year(#dates.createNow())}">2026</span> Talking Hawa — Tous droits réservés.
        </p>
    </div>
</footer>

</body>
</html>
