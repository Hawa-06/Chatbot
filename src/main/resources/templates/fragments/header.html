<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
</head>
<body>

<header th:fragment="navbar" class="app-header">
    <div class="header-container">
        <!-- Logo & Nom -->
        <a th:href="@{/}" class="header-brand">
            <span class="header-avatar" aria-hidden="true">👩🏾‍🦱</span>
            <span class="header-title">Talking <span>Hawa</span></span>
        </a>

        <!-- Navigation centrale -->
        <nav class="header-nav" aria-label="Navigation principale">

            <a th:href="@{/historique}" class="nav-link">Historique</a>

        <!-- Actions à droite -->

            <a th:href="@{/upgrade}" class="btn-upgrade">✦ Mettre à niveau</a>
