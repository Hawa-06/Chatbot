<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Connexion — Talking Hawa', 'login', ~{::pageContent})}">
<body>

<section th:fragment="pageContent" style="width: 100%; max-width: 440px;">
    <div style="background: #ffffff; border-radius: 28px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(232, 62, 140, 0.08); text-align: center;">
        <div style="width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; padding: 4px; background: linear-gradient(135deg, #f472b6, #ec4899); display: flex; align-items: center; justify-content: center;">
            <div style="width: 100%; height: 100%; border-radius: 50%; background-color: #fde68a; display: flex; align-items: center; justify-content: center; font-size: 2.2rem;">
                👩🏾‍🦱
            </div>
        </div>

        <div style="display: inline-flex; align-items: center; gap: 6px; background-color: #fce7f3; color: #e83e8c; font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background-color: #e83e8c;"></span>
            Assistant IA Personnel
        </div>

        <h1 style="font-size: 1.9rem; font-weight: 800; margin-bottom: 8px;">
            Talking <span style="color: #e83e8c;">Hawa</span>
        </h1>
        <p style="font-size: 0.92rem; color: #6b7280; margin-bottom: 24px;">
            Bienvenue ! Connectez-vous pour démarrer vos échanges.
        </p>

        <!-- Message d'erreur optionnel passé par le contrôleur -->
        <div th:if="${errorMessage}"
             th:text="${errorMessage}"
             style="background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 12px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 18px; text-align: left;">
        </div>

        <form th:action="@{/login}" method="post" style="text-align: left;">
            <div style="margin-bottom: 18px;">
                <label for="email" style="display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7280; margin-bottom: 8px;">
                    Adresse e-mail
                </label>
                <input id="email"
                       name="username"
                       type="email"
                       th:value="${email}"
                       placeholder="hawa.etudiante@univ-paris.fr"
                       required
                       style="width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid #e5e7eb; border-radius: 14px; background-color: #f9fafb; font-size: 0.95rem;" />
            </div>

            <div style="margin-bottom: 18px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="password" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7280;">
                        Mot de passe
                    </label>
                    <a th:href="@{/forgot-password}" style="font-size: 0.82rem; font-weight: 600; color: #e83e8c; text-decoration: none;">
                        Mot de passe oublié ?
                    </a>
                </div>
                <input id="password"
                       name="password"
                       type="password"
                       placeholder="••••••••••••"
                       required
                       style="width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid #e5e7eb; border-radius: 14px; background-color: #f9fafb; font-size: 0.95rem;" />
            </div>

            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 22px;">
                <input id="rememberMe" name="remember-me" type="checkbox" style="width: 18px; height: 18px; accent-color: #e83e8c;" />
                <label for="rememberMe" style="font-size: 0.88rem; color: #374151; cursor: pointer;">
                    Rester connectée
                </label>
            </div>

            <button type="submit"
                    style="width: 100%; height: 50px; border: none; border-radius: 14px; background-color: #e83e8c; color: #ffffff; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(232, 62, 140, 0.28);">
                Se connecter &rarr;
            </button>
        </form>

        <div style="height: 1px; background-color: #f3f4f6; margin: 24px 0 18px;"></div>

        <p style="font-size: 0.88rem; color: #6b7280;">
            Pas encore de compte ? <a th:href="@{/register}" style="color: #e83e8c; font-weight: 700; text-decoration: none;">S'inscrire</a>
        </p>
    </div>
</section>

</body>
</html>
